<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Fogos Ativos</title>
  <!-- Before the page draws: applies a saved light/dark choice (no inline scripts under the CSP). -->
  <script src="theme.js?v=1"></script>
  <link rel="stylesheet" href="pico.red.min.css?v=1" />
  <link rel="stylesheet" href="styles.css?v=15" />
</head>
<body>
  <header class="container-fluid">
    <nav>
      <ul>
        <li><strong>🔥 Fogos Ativos</strong></li>
      </ul>
      <ul class="filters">
        <li>
          <select id="distrito" aria-label="Distrito">
            <option value="">Todos os distritos</option>
          </select>
        </li>
        <li>
          <select id="concelho" aria-label="Concelho" disabled>
            <option value="">Todos os concelhos</option>
          </select>
        </li>
      </ul>
      <ul class="theme">
        <li>
          <!-- Light/dark toggle, wired up by theme.js. -->
          <button id="theme-toggle" class="theme-toggle secondary outline" type="button" hidden>🌙</button>
        </li>
      </ul>
    </nav>
  </header>

  <main class="container">
    <p id="status" hidden></p>
    <div id="incidents"></div>
  </main>

  <footer class="container-fluid">
    <small>Dados: <a href="https://fogos.pt" target="_blank" rel="noopener">fogos.pt</a> / ANEPC</small>
  </footer>

  <script type="module" src="app.js?v=20"></script>
</body>
</html>
